services:

  sinapsis-anolomaly-detection-main: &default
    image: sinapsis-anolomaly-detection:base
    build:
      context: ../
      dockerfile: docker/Dockerfile
      ssh:
        - default
    shm_size: '8gb'
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /lib/python3.10/:/app/.venv/lib/python3.10/site-packages
      GRADIO_SHARE_APP: ${GRADIO_SHARE_APP:-false}
    volumes:
      - "~/.cache/sinapsis/:/root/.cache/sinapsis"

    network_mode: "host"
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]