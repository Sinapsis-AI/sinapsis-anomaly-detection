agent:
  name: anomalib_inference
  description: "Agent to perform OV classification and draw resulting label."

templates:
- template_name: InputTemplate
  class_name: InputTemplate
  attributes: {}

- template_name: AnomalibOpenVINOInference
  class_name: AnomalibOpenVINOInference
  template_input: InputTemplate
  attributes:
    model_path: "artifacts/exported_models/weights/openvino/model.xml"
    device: "CPU"
    model_height: 512
    model_width: 512

- template_name: BBoxDrawer
  class_name: BBoxDrawer
  template_input:  AnomalibOpenVINOInference
  attributes:
    randomized_color: false
    draw_classification_label: false

- template_name: SegmentationMaskDrawer
  class_name: SegmentationMaskDrawer
  template_input: BBoxDrawer
  attributes:
    overwrite: true
    randomized_color: false
    draw_classification_label: false